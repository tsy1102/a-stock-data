# ═══════════════════════════════════════
# V7.5: 关键词库与标签配置
# 作用：集中管理字符串型配置（文本关键词/标签/板块映射）
# 读取方式：stock_common._load_settings() -> 返回 dict
# ═══════════════════════════════════════
# 与 strategy_config.yaml 的分工：
#   strategy_config.yaml = 数值型阈值（涨停比例、PE/PB、ROE 等）
#   keywords_config.yaml = 字符串型配置（关键词列表、标签映射、文本关键词匹配规则）
# ═══════════════════════════════════════

# 龙虎榜席位标签库 → get_sht_report.py 使用
# 顺序=匹配优先级，命中第一个即返回
trader_tags:
  机构专用: "[机构]"
  深股通专用: "[北向]"
  沪股通专用: "[北向]"
  中信证券总部: "[国家队]"
  中国证券金融: "[国家队]"
  中央汇金: "[国家队]"
  华鑫证券上海: "[量化]"
  中国国际金融: "[量化]"
  华泰证券总部: "[量化]"
  中信证券西安朱雀: "[游资]"
  中国银河证券北京中关村: "[游资]"
  国泰君安上海江苏路: "[游资]"
  财通证券杭州上塘路: "[游资]"
  兴业证券陕西: "[游资]"
  国泰君安三亚: "[游资]"
  中信证券上海分公司: "[游资]"
  东方财富证券拉萨: "[散户]"
  东方财富证券昌都: "[散户]"

# 战略公告关键词 → stock_common.get_strategic_announcements 使用
# 命中则保留该条公告，否则忽略（巨潮API）
announcement_keywords:
  - 回购
  - 增持
  - 减持
  - 年报
  - 分红
  - 派息
  - 激励
  - 员工持股
  - 战略合作
  - 业绩预告
  - 中标
  - 立案
  - 合同
  - 收购
  - 股权转让
  - 异动
  - 严重异动

# 公告标题噪音词（需过滤，匹配则丢弃）
announcement_noise:
  - 摘要
  - 提示性
  - 英文版

# V7.5新增：重要公告关键词（命中则标记为重要，否则为普通）
# 仅在短线报告(7天)/中线报告(30天)中使用，全维度报告不过滤
announcement_importance_keywords:
  - 回购
  - 增持
  - 减持
  - 并购
  - 收购
  - 重大合同
  - 中标
  - 业绩预告
  - 年报
  - 分红
  - 派息
  - 股权激励
  - 员工持股计划
  - 战略合作
  - 立案调查
  - 行政处罚
  - 监管措施

# 策略08/策略16-政策驱动关键词 → get_val_report.py 使用
policy_keywords:
  - 政策
  - 支持
  - 资金
  - 规划
  - 印发
  - 发布
  - 推动
  - 十四五
  - 补贴
  - 减税
  - 利好
  - 振兴
  - 基建
  - 消费
  - 科技

# 策略09-日历效应月度映射 → get_val_report.py 使用
season_map:
  1: [银行, 保险, 煤炭]
  2: [农林牧渔, 建材, 化工]
  3: [TMT, 计算机, 通信]
  4: [食品饮料, 医药, 家电]
  5: [电力, 公用事业, 交通运输]
  6: [电子, 半导体, 军工]
  7: [有色, 钢铁, 化工]
  8: [旅游, 航空, 消费]
  9: [电子, 汽车, 机械]
  10: [银行, 地产, 建筑]
  11: [家电, 食品饮料, 医药]
  12: [煤炭, 公用事业, 银行]

# ── 行业名清理（统一去后缀/去冗余字符） ───
# 使用者: get_sht_report.py / get_med_report.py / get_val_report.py
industry_name_cleanup:
  # 板块后缀去重
  board_suffixes:
    - "行业"
    - "板块"
    - "概念"
    - "指数"
  # 冗余空白字符
  strip_chars: " \t\r\n"

# ── 行业别名映射（标准名 -> 列表） ───
# 使用者: get_industry_peers / get_stock_sector_rank
industry_aliases:
  "半导体": ["芯片", "集成电路", "半导体设备", "芯片设计", "晶圆"]
  "白酒": ["白酒酿造", "高端白酒", "次高端白酒"]
  "医药": ["生物医药", "化学制药", "中药", "医疗器械", "医疗服务"]
  "银行": ["商业银行", "国有大行", "股份制银行"]
  "新能源": ["新能源车", "新能源汽车", "动力电池", "储能"]
  "TMT": ["传媒", "互联网", "通信", "计算机", "软件"]
  "军工": ["国防军工", "航空装备", "航天装备", "船舶制造"]
  "电力": ["火电", "水电", "核电", "风电", "光伏", "电网设备"]
